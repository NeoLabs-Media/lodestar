<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lodestar — personal watch recommendations (anime first, more soon), including hidden gems. Runs entirely in your browser; your ratings never leave your device.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lodestar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->

  <title>Lodestar</title>
  <script>(function(){var h=location.hash;if(h.indexOf('#cr=')===0){window.__lodestarImport=h.slice(4);history.replaceState(null,'',location.pathname+location.search);}})();</script>
  <meta name="theme-color" content="#0D0D0C">
  <style>html,body{margin:0;background:#0D0D0C}#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8F8A7E;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.04em}#splash b{color:#E3B65B;font-size:34px;font-weight:400}</style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash"><b>&#10022;</b><span>Loading Lodestar &middot; first visit downloads the catalog (~47&nbsp;MB)</span></div>
  <script src="flutter_bootstrap.js" async></script>
