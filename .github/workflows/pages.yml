name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply catalog delta (optional)
        run: |
          # A small catalog_delta.db at the repo root is merged into catalog.db for this build only
          # (idempotent; see tools/apply_delta.py). Fold it into catalog.db and delete it whenever convenient.
          if [ -f catalog_delta.db ]; then python3 tools/apply_delta.py catalog.db catalog_delta.db; fi
      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("file:catalog.db?mode=ro", uri=True)
          meta = dict(c.execute("select key, value from meta"))
          n = c.execute("select count(*) from title").fetchone()[0]
          assert meta.get("schema") in ("1", "2", "3"), f"unsupported schema {meta.get('schema')!r}"
          assert n > 0, "catalog has no titles"
          assert c.execute("select count(*) from facet_vocab").fetchone()[0] > 0, "no facet vocabulary"
          kinds = "anime"
          if meta["schema"] in ("2", "3"):
              kinds = ", ".join(r[0] for r in c.execute("select distinct kind from title order by 1"))
              assert c.execute("select count(*) from title where key is null").fetchone()[0] == 0, "titles without a key"
          open("catalog.version", "w").write(f"{meta['built_at']} n={n} schema={meta['schema']}\n")
          print(f"catalog OK: {n} titles ({kinds}), schema {meta['schema']}, built {meta['built_at']}")
          PY
      - name: Build web
        run: flutter build web --release --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Engine tests (personas, search, categories…); informational, does not gate the deploy.
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter test
